<meta charset="utf-8">
<title>Warp Scanlines Playground</title>
<style>
  /* Layout: full-bleed WebGL canvas, floating control dock bottom-left (stacks on phones) */
  :root {
    color-scheme: dark;
    --bg: #060607;
    --panel: rgba(10, 12, 22, 0.78);
    --line: rgba(94, 233, 255, 0.16);
    --fg: #d9e4ff;
    --muted: #7c89b0;
    --accent: #5ee9ff;
    --deep: #1f3dff;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "Sora", system-ui, sans-serif;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--sans); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .dock {
    position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: min(320px, calc(100vw - 32px)); max-height: calc(100% - 32px); overflow-y: auto;
    background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 10px; font-size: 12px;
  }
  .dock header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .dock h1 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
  .dock h1 span { color: var(--accent); }
  .dock .hint { color: var(--muted); font-family: var(--mono); font-size: 10.5px; }
  .row { display: grid; grid-template-columns: 92px 1fr 40px; align-items: center; gap: 8px; }
  .row label { color: var(--muted); font-family: var(--mono); font-size: 11px; }
  .row output { font-family: var(--mono); font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .colors { display: flex; gap: 10px; flex-wrap: wrap; }
  .colors label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-family: var(--mono); font-size: 11px; }
  input[type=color] { width: 26px; height: 20px; border: 1px solid var(--line); border-radius: 4px; background: none; padding: 0; }
  .actions { display: flex; gap: 8px; }
  button {
    flex: 1; font: 600 11px var(--mono); color: var(--fg); background: transparent;
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  pre {
    margin: 0; padding: 10px; background: rgba(0,0,0,0.45); border: 1px solid var(--line); border-radius: 6px;
    font: 10.5px/1.5 var(--mono); color: var(--accent); overflow-x: auto; white-space: pre;
  }
  .dock .body { display: flex; flex-direction: column; gap: 10px; }
  .dock.collapsed .body { display: none; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Sora:wght@400;600&display=swap">

<div id="stage"></div>

<aside class="dock" id="dock">
  <header>
    <h1>Warp <span>Scanlines</span></h1>
    <button id="toggle" style="flex:0" aria-expanded="true">Ẩn</button>
  </header>
  <div class="body">
    <div class="hint">Di chuột để lệch tâm tia · kéo slider để chỉnh props</div>
    <div class="colors">
      <label>colorA <input type="color" id="colorA" value="#1f3dff"></label>
      <label>colorB <input type="color" id="colorB" value="#5ee9ff"></label>
      <label>bg <input type="color" id="backgroundColor" value="#060607"></label>
    </div>
    <div id="sliders" style="display:flex;flex-direction:column;gap:6px"></div>
    <div class="actions">
      <button id="random">Seed ngẫu nhiên</button>
      <button id="reset">Mặc định</button>
    </div>
    <pre id="code"></pre>
    <button id="copy">Copy JSX</button>
  </div>
</aside>

<script type="module">
  import { vertex, fragment, hexToRgb } from './warpShader.js';

  const DEFAULTS = {
    colorA: '#1f3dff', colorB: '#5ee9ff', backgroundColor: '#060607',
    rayCount: 28, density: 0.42, speed: 0.25, lineSpacing: 6, lineThickness: 0.3,
    hole: 0.24, streak: 0.85, brightness: 0.95, gridSize: 12, gridOpacity: 0.6, seed: 1, mouseInfluence: 0.15
  };
  const RANGES = {
    rayCount: [6, 90, 1], density: [0.1, 1, 0.01], speed: [0, 1.5, 0.01],
    lineSpacing: [2, 20, 1], lineThickness: [0.1, 0.9, 0.01], hole: [0, 0.6, 0.01],
    streak: [0.1, 0.95, 0.01], brightness: [0.3, 3, 0.05], gridSize: [4, 48, 1],
    gridOpacity: [0, 3, 0.05], mouseInfluence: [0, 0.5, 0.01], seed: [0, 100, 1]
  };
  const state = { ...DEFAULTS };

  // --- WebGL ---
  const stage = document.getElementById('stage');
  const canvas = document.createElement('canvas');
  stage.appendChild(canvas);
  const gl = canvas.getContext('webgl');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vertex));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fragment));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'position');
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(prog, n);

  const resize = () => {
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
  };
  addEventListener('resize', resize); resize();

  const mouse = { x: 0.5, y: 0.5 }, smooth = { x: 0.5, y: 0.5 };
  addEventListener('pointermove', e => { mouse.x = e.clientX / innerWidth; mouse.y = 1 - e.clientY / innerHeight; });

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const frame = t => {
    const mi = state.mouseInfluence;
    smooth.x += (0.5 + (mouse.x - 0.5) * mi * 2 - smooth.x) * 0.05;
    smooth.y += (0.5 + (mouse.y - 0.5) * mi * 2 - smooth.y) * 0.05;
    gl.uniform1f(U('iTime'), reduce ? 2 : t * 0.001);
    gl.uniform2f(U('iResolution'), canvas.width, canvas.height);
    gl.uniform1f(U('uDpr'), dpr);
    gl.uniform2f(U('uCenter'), smooth.x, smooth.y);
    gl.uniform3fv(U('uColorA'), hexToRgb(state.colorA));
    gl.uniform3fv(U('uColorB'), hexToRgb(state.colorB));
    gl.uniform3fv(U('uBgColor'), hexToRgb(state.backgroundColor));
    for (const k of ['rayCount','density','speed','lineSpacing','lineThickness','hole','streak','brightness','gridSize','gridOpacity','seed'])
      gl.uniform1f(U('u' + k[0].toUpperCase() + k.slice(1)), state[k]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);

  // --- Controls ---
  const sliders = document.getElementById('sliders');
  for (const [k, [min, max, step]] of Object.entries(RANGES)) {
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<label for="${k}">${k}</label><input type="range" id="${k}" min="${min}" max="${max}" step="${step}"><output id="${k}-out"></output>`;
    sliders.appendChild(row);
    row.querySelector('input').addEventListener('input', e => { state[k] = +e.target.value; sync(); });
  }
  for (const k of ['colorA', 'colorB', 'backgroundColor'])
    document.getElementById(k).addEventListener('input', e => { state[k] = e.target.value; sync(); });

  const jsx = () => {
    const props = Object.entries(state).filter(([k, v]) => v !== DEFAULTS[k])
      .map(([k, v]) => typeof v === 'string' ? `  ${k}="${v}"` : `  ${k}={${v}}`);
    return `<div style={{ width: '100%', height: 600 }}>\n  <WarpScanlines${props.length ? '\n  ' + props.join('\n  ') + '\n  ' : ' '}/>\n</div>`;
  };
  function sync() {
    for (const k of Object.keys(RANGES)) {
      document.getElementById(k).value = state[k];
      document.getElementById(k + '-out').textContent = state[k];
    }
    for (const k of ['colorA', 'colorB', 'backgroundColor']) document.getElementById(k).value = state[k];
    document.getElementById('code').textContent = jsx();
  }
  sync();

  document.getElementById('random').onclick = () => { state.seed = Math.floor(Math.random() * 100); sync(); };
  document.getElementById('reset').onclick = () => { Object.assign(state, DEFAULTS); sync(); };
  const copyBtn = document.getElementById('copy');
  copyBtn.onclick = () => {
    navigator.clipboard.writeText(jsx()).then(() => { copyBtn.textContent = 'Đã copy'; },
      () => { getSelection().selectAllChildren(document.getElementById('code')); copyBtn.textContent = 'Nhấn Ctrl/Cmd+C'; });
    setTimeout(() => copyBtn.textContent = 'Copy JSX', 1600);
  };
  const toggle = document.getElementById('toggle'), dock = document.getElementById('dock');
  toggle.onclick = () => { const c = dock.classList.toggle('collapsed'); toggle.textContent = c ? 'Hiện' : 'Ẩn'; toggle.setAttribute('aria-expanded', String(!c)); };
</script>
